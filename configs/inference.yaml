# Inference configuration
# Environment overrides: DQD_<KEY>

default_model: "Improved DistilBERT (Week 4)"
default_device: "cpu"  # "cpu" or "cuda"
auto_device: true      # auto-detect CUDA if available (used by embedding models)

max_length: 128
default_threshold: 0.5

# Per-model thresholds (optimal F1 thresholds on validation set)
per_model_thresholds:
  "Cross-Encoder-Quora (Trained)": 0.52
  "E5-quora-finetuned": 0.63
  "E5-base-v2": 0.59
  "BGE-base-en-v1.5": 0.30
  "MPNet-base-v2": 0.36

# Sigmoid calibration parameters: (steepness, midpoint)
sigmoid_params:
  "E5-quora-finetuned": [10.0, 0.73]
  "E5-base-v2": [8.0, 0.82]
  "BGE-base-en-v1.5": [15.6755, 0.8591]
  "MPNet-base-v2": [11.5976, 0.8133]
  "default": [15.0, 0.50]

# Confidence computation weights
confidence:
  single_model:
    raw: 0.50
    adjusted: 0.30
    trust: 0.20
  multi_model:
    raw: 0.30
    adjusted: 0.20
    agreement: 0.30
    calibration: 0.15
    trust: 0.15
    uncertainty_penalty: 0.10
    diversity_bonus: 0.01

# Trust score computation weights
trust:
  confidence_weight: 0.40
  agreement_weight: 0.20
  contradiction_weight: 0.15
  calibration_weight: 0.15
  uncertainty_weight: 0.10

# Trust/risk thresholds
trust_thresholds:
  high: 0.80
  medium: 0.60
  low: 0.40

# Demo engine defaults
demo:
  default_goal: "Analyze semantic similarity between two questions"
  default_agents: ["planner", "predict", "memory", "reflection"]
  default_tools: ["predict", "memory"]

# Batch sizes are configured via function defaults in the source code
