name: Build

"on":
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: build-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: duplicate-question-nlp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            duplicate-question-nlp/requirements.txt
            duplicate-question-nlp/pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Verify sdist install
        run: |
          pip install dist/*.tar.gz --no-build-isolation
          python -c "import duplicate_question_app; print('sdist OK:', duplicate_question_app.__version__)"

      - name: Verify wheel install
        run: |
          pip install dist/*.whl --force-reinstall --no-build-isolation
          python -c "import duplicate_question_app; print('wheel OK:', duplicate_question_app.__version__)"

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: duplicate-question-nlp/dist/
          if-no-files-found: error

  verify-cli:
    name: cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: duplicate-question-nlp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            duplicate-question-nlp/requirements.txt
            duplicate-question-nlp/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . --no-build-isolation

      - name: Verify imports
        run: |
          python -c "import duplicate_question_app"
          python -c "from duplicate_question_app.cli import main, predict, benchmark, run_app"
          python -c "from duplicate_question_app._config.loader import get_config"
          python -c "from duplicate_question_app._models.embeddings import _get_sigmoid_params"
          python -c "from duplicate_question_app._preprocessing.text import normalize_question"

      - name: Verify CLI smoke test
        run: |
          python -m duplicate_question_app.cli 2>&1 | grep -q "Duplicate Question Detection"

      - name: List entry points
        run: python -c "import importlib.metadata as md; [print(f'  {ep.name} -> {ep.value}') for ep in md.entry_points(group='console_scripts')]"
