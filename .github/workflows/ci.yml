name: CI

"on":
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package with dev dependencies
        run: |
          pip install -e . --no-build-isolation
          pip install pytest pytest-cov

      - name: Verify editable install
        run: python -c "import duplicate_question_app; print(duplicate_question_app.__version__)"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -m "not slow and not gpu" -q --tb=short --no-header

      - name: Run integration tests
        run: python -m pytest tests/integration/ -q --tb=short --no-header

      - name: Run regression tests
        run: python -m pytest tests/regression/ -q --tb=short --no-header

      - name: Run streamlit smoke tests
        run: python -m pytest tests/streamlit/ -q --tb=short --no-header

      - name: Verify CLI
        run: python -c "from duplicate_question_app.cli import main; main()"

      - name: Verify all core imports
        run: |
          python -c "import duplicate_question_app"
          python -c "from duplicate_question_app._config.loader import get_config"
          python -c "from duplicate_question_app._models.embeddings import _get_sigmoid_params"
          python -c "from duplicate_question_app._preprocessing.text import normalize_question"
          python -c "from duplicate_question_app._inference.transformer import DuplicateQuestionInferenceService"
          python -c "from duplicate_question_app._evaluation.error_analysis import categorize_error"
          python -c "from duplicate_question_app._linguistics.lexical import compute_lexical_penalty"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: .pytest_cache/
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: ruff
        run: ruff check --line-length=120 src/ tests/

      - name: black
        run: black --check --line-length=120 src/ tests/

      - name: isort
        run: isort --check-only --profile=black --line-length=120 src/ tests/

      - name: mypy
        run: mypy --python-version=3.10 --ignore-missing-imports src/duplicate_question_app/
        continue-on-error: true
