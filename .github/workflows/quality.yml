name: Quality

"on":
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duplicate-question-nlp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            duplicate-question-nlp/requirements-dev.txt
            duplicate-question-nlp/pyproject.toml

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: ruff
        run: ruff check --line-length=120 src/ tests/

      - name: black
        run: black --check --line-length=120 src/ tests/

      - name: isort
        run: isort --check-only --profile=black --line-length=120 src/ tests/

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duplicate-question-nlp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            duplicate-question-nlp/requirements-dev.txt
            duplicate-question-nlp/pyproject.toml

      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-build-isolation
          pip install mypy tokenize-rt

      - name: mypy
        run: mypy --python-version=3.10 --ignore-missing-imports src/duplicate_question_app/
        continue-on-error: true

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duplicate-question-nlp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true
