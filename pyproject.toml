[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-question-detection"
dynamic = ["version"]
description = "Research-grade semantic duplicate question detection with 11 models, ensemble inference, and interactive Streamlit dashboard"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

authors = [
    {name = "Duplicate Question Detection Team", email = "team@example.com"},
]

keywords = [
    "nlp",
    "duplicate-question-detection",
    "quora",
    "sentence-transformers",
    "distilbert",
    "streamlit",
    "machine-learning",
    "deep-learning",
    "transformers",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.36.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "safetensors>=0.4.0",
    "sentence-transformers>=3.0.0",
    "accelerate>=1.1.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/your-org/duplicate-question-detection"
Repository = "https://github.com/your-org/duplicate-question-detection"
Documentation = "https://duplicate-question-detection.readthedocs.io"
"Bug Tracker" = "https://github.com/your-org/duplicate-question-detection/issues"
Changelog = "https://github.com/your-org/duplicate-question-detection/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gpu = ["torch>=2.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "ruff>=0.5.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0",
]
all = [
    "duplicate-question-detection[dev,test,docs,gpu]",
]

[project.scripts]
dqd = "duplicate_question_app.cli:main"
dqd-app = "duplicate_question_app.cli:run_app"
dqd-predict = "duplicate_question_app.cli:predict"
dqd-benchmark = "duplicate_question_app.cli:benchmark"
dqd-doctor = "duplicate_question_app.cli:_run_doctor"
dqd-health = "duplicate_question_app.cli:_run_health"
dqd-validate = "duplicate_question_app.cli:_run_validate"
dqd-config = "duplicate_question_app.cli:_run_config"
ares = "ares.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["duplicate_question_app*", "ares*"]

[tool.setuptools.package-data]
duplicate_question_app = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "duplicate_question_app.__version__"}

# ============================================================
# Code quality configuration
# ============================================================

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".git", ".opencode", "build", "dist", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (black handles)
    "E402",  # module level import not at top (needed for config)
    "N801",  # class names (ML conventions)
    "N802",  # function names (backward compat)
    "N803",  # argument names
    "N806",  # variable names
    "N815",  # mixedCase class attributes
    "UP007", # non-pep604 typing
    "B008",  # function call in default args
    "SIM117", # nested with statements (preserves context manager cleanup order)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", ".git", ".opencode"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
ignore_missing_imports = true
check_untyped_defs = false
exclude = [
    ".venv/",
    ".git/",
    ".opencode/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "streamlit",
    "torch",
    "transformers",
    "sentence_transformers",
    "sklearn.*",
    "numpy",
    "pandas",
    "matplotlib.*",
    "seaborn",
    "scipy.*",
    "joblib",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:warnings --strict-markers"
markers = [
    "fast: Quick unit tests (default)",
    "slow: Tests that may take longer to run",
    "gpu: Tests requiring GPU hardware",
    "integration: Tests that cross module boundaries",
    "smoke: Lightweight smoke/sanity checks",
    "regression: Golden-output regression tests",
    "streamlit: Streamlit-specific smoke tests",
    "cli: Command-line interface tests",
]

[tool.coverage.run]
source = ["src/duplicate_question_app"]
omit = [
    "src/duplicate_question_app/__init__.py",
    "src/duplicate_question_app/_version.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
ignore_errors = true
