global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ares-api"
    static_configs:
      - targets: ["ares-api:8000"]
    metrics_path: "/api/v1/metrics"
    scheme: "http"
    scrape_interval: 10s

  - job_name: "ares-grpc"
    static_configs:
      - targets: ["ares-grpc:50051"]
    scrape_interval: 10s
